<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Inspeção do modelo do avião</title>
  <style>
    * { margin: 0; box-sizing: border-box; }
    body { background: #0b1020; color: #e8ecf4;
           font-family: system-ui, sans-serif;
           display: grid; grid-template-columns: repeat(2, 1fr); }
    .vista { position: relative; height: 50vh; overflow: hidden; }
    .vista > span { position: absolute; top: 10px; left: 14px; font-size: 13px;
                    color: #9aa5b8; z-index: 2; letter-spacing: .04em; }
    canvas { display: block; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div class="vista" data-vista="frente"><span>FRENTE</span></div>
  <div class="vista" data-vista="lado"><span>LADO</span></div>
  <div class="vista" data-vista="cima"><span>CIMA</span></div>
  <div class="vista" data-vista="tres-quartos"><span>3/4</span></div>

  <script type="module">
    import * as THREE from 'three';
    import { criarAviao } from './js/aviao.js';

    // O nariz aponta para -Z, então "frente" olha do -Z para o avião.
    const CAMERAS = {
      'frente':       [0, 0.5, -14],
      'lado':         [14, 1.5, 0],
      'cima':         [0, 14, 0.01],
      'tres-quartos': [9, 5, 11],
    };

    for (const el of document.querySelectorAll('.vista')) {
      const cena = new THREE.Scene();
      cena.background = new THREE.Color(0x0b1020);

      cena.add(new THREE.HemisphereLight(0x8899cc, 0x223344, 1.2));
      const sol = new THREE.DirectionalLight(0xfff2d8, 1.5);
      sol.position.set(6, 10, 8);
      cena.add(sol);

      const aviao = criarAviao();
      cena.add(aviao);

      const largura = el.clientWidth;
      const altura = el.clientHeight;
      const cam = new THREE.PerspectiveCamera(45, largura / altura, 0.1, 100);
      cam.position.set(...CAMERAS[el.dataset.vista]);
      cam.lookAt(0, 0, 0);

      const rend = new THREE.WebGLRenderer({ antialias: true });
      rend.setPixelRatio(Math.min(devicePixelRatio, 2));
      rend.setSize(largura, altura);
      el.appendChild(rend.domElement);

      rend.render(cena, cam);
    }
  </script>
</body>
</html>
